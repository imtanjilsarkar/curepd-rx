<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurePd Rx — Prescription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/layer0-medicines.js"></script>
    <script src="js/layer1-diseases.js"></script>
    <script src="js/layer2-engine.js"></script>
    <style>
        :root{--navy:#0d1b2a;--teal:#0fa99e;--teal-light:#13c4b8;--text-main:#1a2332;--text-muted:#6b7a8d;--border:#e0e6ef;--bg:#f4f7fb;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);}
        .navbar{background:var(--navy);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.18);}
        .nav-left{display:flex;align-items:center;gap:18px;}
        .back-link{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;transition:color .2s;}
        .back-link:hover{color:white;}
        .nav-title{font-family:'DM Serif Display',serif;font-size:18px;color:white;}
        .nav-title span{color:var(--teal-light);}
        .nav-actions{display:flex;align-items:center;gap:10px;}
        .btn-nav{height:36px;padding:0 16px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;}
        .btn-outline{border:1.5px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.75);font-weight:500;}
        .btn-outline:hover{background:rgba(255,255,255,.08);color:white;}
        .btn-share{background:rgba(15,169,158,.15);color:var(--teal-light);border:1px solid rgba(15,169,158,.3);font-weight:500;}
        .btn-share:hover{background:rgba(15,169,158,.28);}
        .page-wrap{max-width:980px;margin:0 auto;padding:26px 18px;display:grid;grid-template-columns:1fr 284px;gap:18px;align-items:start;}
        .rx-paper{background:white;border-radius:16px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.06);overflow:hidden;}
        .rx-stripe{height:5px;background:linear-gradient(90deg,var(--teal),var(--teal-light));}
        .rx-body{padding:30px 34px;}
        .rx-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:18px;margin-bottom:22px;border-bottom:1.5px solid var(--border);}
        .rx-brand{font-family:'DM Serif Display',serif;font-size:26px;color:var(--teal);}
        .rx-brand-sub{font-size:11px;color:var(--text-muted);margin-top:4px;}
        .rx-dr-name{font-size:15px;font-weight:600;color:var(--text-main);text-align:right;}
        .rx-dr-detail{font-size:12px;color:var(--text-muted);line-height:1.7;text-align:right;}
        .rx-patient-band{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
        .rpf-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:3px;}
        .rpf-val{font-size:14px;font-weight:500;color:var(--text-main);}
        .rx-ctx-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
        .ctx-tag{font-size:10px;font-weight:600;padding:3px 10px;border-radius:5px;background:#fef3c7;color:#92400e;border:1px solid #fde68a;}
        .rx-section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
        .rx-section-title::after{content:'';flex:1;height:1px;background:rgba(15,169,158,.2);}
        .rx-clinical{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
        .rx-cbox{background:var(--bg);border-radius:9px;padding:13px 16px;}
        .rx-clabel{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:5px;}
        .rx-cval{font-size:13px;color:var(--text-main);line-height:1.5;}
        .rx-med-table{width:100%;border-collapse:collapse;margin-bottom:22px;}
        .rx-med-table th{padding:9px 12px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);background:var(--bg);border-bottom:1px solid var(--border);}
        .rx-med-table td{padding:11px 12px;font-size:13px;color:var(--text-main);border-bottom:1px solid #f0f3f8;vertical-align:top;}
        .rx-med-table tr:last-child td{border-bottom:none;}
        .med-num{width:22px;height:22px;border-radius:50%;background:rgba(15,169,158,.1);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:5px;}
        .dose-badge{background:var(--navy);color:var(--teal-light);font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;font-family:monospace;}
        .inst-badge{background:#f0fdf4;color:#065f46;font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid #bbf7d0;}
        .rx-tests{background:var(--bg);border-radius:9px;padding:13px 16px;margin-bottom:18px;}
        .test-tag{display:inline-block;background:white;border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px;margin:3px 4px 3px 0;}
        .rx-advice{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:13px 16px;margin-bottom:18px;}
        .rx-advice-text{font-size:13px;color:#92400e;line-height:1.6;white-space:pre-line;}
        .rx-followup{display:inline-flex;align-items:center;gap:8px;background:rgba(15,169,158,.06);border:1px solid rgba(15,169,158,.2);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--teal);margin-bottom:22px;}
        .rx-footer{border-top:1px solid var(--border);padding-top:16px;display:flex;justify-content:space-between;align-items:flex-end;}
        .rx-footer-left{font-size:11px;color:var(--text-muted);}
        .rx-id{font-family:monospace;font-size:11px;background:var(--bg);padding:3px 8px;border-radius:5px;color:var(--text-muted);display:inline-block;margin-top:4px;}
        /* AI Analysis */
        .ai-analysis{background:white;border-radius:14px;border:1px solid var(--border);margin-top:14px;overflow:hidden;}
        .ai-analysis-hd{background:linear-gradient(135deg,#0d1b2a,#162032);padding:14px 20px;display:flex;align-items:center;gap:10px;}
        .ai-analysis-hd i{color:var(--teal-light);font-size:16px;}
        .ai-analysis-hd h3{font-size:14px;font-weight:600;color:white;}
        .ai-analysis-hd p{font-size:11px;color:rgba(255,255,255,.42);}
        .ai-analysis-bd{padding:20px 22px;}
        .med-explain{margin-bottom:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
        .med-explain:last-child{margin-bottom:0;}
        .me-hd{padding:11px 16px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .2s;}
        .me-hd:hover{background:#edf2f7;}
        .me-name{font-size:13px;font-weight:600;color:var(--text-main);}
        .me-meta{font-size:11px;color:var(--text-muted);margin-top:1px;}
        .me-chev{color:var(--teal);font-size:12px;transition:transform .2s;flex-shrink:0;}
        .me-bd{display:none;padding:14px 16px;border-top:1px solid var(--border);}
        .me-bd.open{display:block;}
        .me-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
        .me-row:last-child{margin-bottom:0;}
        .me-ico{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
        .me-ico.blue{background:rgba(59,130,246,.1);color:#3b82f6;}
        .me-ico.green{background:#d1fae5;color:#065f46;}
        .me-ico.amber{background:#fef3c7;color:#92400e;}
        .me-ico.red{background:#fee2e2;color:#dc2626;}
        .me-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);}
        .me-txt{font-size:13px;color:var(--text-main);margin-top:2px;line-height:1.5;}
        .safety-warn{display:inline-flex;align-items:center;gap:4px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;margin-top:4px;border:1px solid #fde68a;}
        #aiPatientSummary{font-size:13px;color:var(--text-muted);line-height:1.75;background:var(--bg);border-radius:9px;padding:14px;margin-top:12px;font-style:italic;}
        .ai-load-btn{width:100%;margin-top:12px;padding:11px;background:var(--teal);color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;box-shadow:0 3px 12px rgba(15,169,158,.25);}
        .ai-load-btn:hover{background:var(--teal-light);}
        .ai-load-btn:disabled{opacity:.6;pointer-events:none;}
        /* Sidebar */
        .sidebar{display:flex;flex-direction:column;gap:14px;}
        .qr-card{background:white;border-radius:14px;border:1px solid var(--border);padding:18px;text-align:center;}
        .qr-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);margin-bottom:12px;}
        #qrcode{display:flex;justify-content:center;margin-bottom:10px;}
        .qr-link{font-size:11px;color:var(--text-muted);word-break:break-all;background:var(--bg);padding:7px 10px;border-radius:7px;margin-bottom:10px;display:block;text-align:left;}
        .copy-btn{width:100%;height:38px;border-radius:9px;background:rgba(15,169,158,.08);color:var(--teal);border:1.5px solid rgba(15,169,158,.2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s;}
        .copy-btn:hover{background:var(--teal);color:white;border-color:var(--teal);}
        .info-card{background:white;border-radius:12px;border:1px solid var(--border);padding:16px;}
        .ic-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);margin-bottom:10px;}
        .info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f3f8;}
        .info-row:last-child{border-bottom:none;}
        .ir-l{font-size:12px;color:var(--text-muted);}
        .ir-v{font-size:12px;font-weight:500;color:var(--text-main);}
        .badge-g{background:#d1fae5;color:#065f46;font-size:10px;font-weight:600;padding:2px 8px;border-radius:5px;}
        .badge-a{background:#fef3c7;color:#92400e;font-size:10px;font-weight:600;padding:2px 8px;border-radius:5px;}
        .act-card{background:white;border-radius:12px;border:1px solid var(--border);padding:14px;}
        .act-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;transition:all .2s;margin-bottom:4px;}
        .act-item:last-child{margin-bottom:0;}
        .act-item:hover{background:var(--bg);}
        .act-ico{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
        .act-lbl{font-size:13px;font-weight:600;color:var(--text-main);}
        .act-sub{font-size:11px;color:var(--text-muted);}
        .state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--text-muted);}
        .state-box i{font-size:40px;margin-bottom:14px;}
        .state-box h3{font-size:16px;font-weight:600;color:var(--text-main);margin-bottom:6px;}
        .state-box p{font-size:13px;}
        .state-box a{color:var(--teal);font-size:13px;margin-top:14px;display:block;}
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:11px 22px;border-radius:12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;z-index:999;transition:opacity .3s;white-space:nowrap;}
        .toast.show{opacity:1;}
        .toast i{color:#4ade80;}
        @media print{.navbar,.sidebar,.ai-analysis,.toast{display:none!important;}body{background:white;}.page-wrap{display:block;padding:0;}.rx-paper{border:none;border-radius:0;box-shadow:none;}.rx-stripe{display:none;}.rx-body{padding:16px 20px;}}
        @media(max-width:768px){.page-wrap{grid-template-columns:1fr;}.rx-patient-band{grid-template-columns:repeat(2,1fr);}.rx-clinical{grid-template-columns:1fr;}.navbar{padding:0 16px;}}
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <div class="nav-title">CurePd <span>Rx</span> — Prescription</div>
    </div>
    <div class="nav-actions">
        <button class="btn-nav btn-share" id="shareBtn"><i class="fas fa-share-alt"></i> Share</button>
        <button class="btn-nav btn-outline" id="printBtn"><i class="fas fa-print"></i> Print</button>
        <button class="btn-nav btn-outline" id="pdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>
    </div>
</nav>

<div class="page-wrap">
    <div>
        <div class="rx-paper" id="rxPaper">
            <div class="state-box"><i class="fas fa-spinner fa-pulse" style="color:var(--teal)"></i><p>Loading...</p></div>
        </div>
        <div id="aiSection"></div>
    </div>
    <div class="sidebar" id="sidebar" style="display:none;"></div>
</div>
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
function esc(s){if(!s)return'';return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtDate(d){if(!d)return'—';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;}
function toast(msg){document.getElementById('toastMsg').textContent=msg;const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}

function renderPaper(pres,dr){
    const meds=pres.medicines||[];
    const tests=pres.labTests?pres.labTests.split(',').map(t=>t.trim()).filter(Boolean):[];
    const ctx=pres.patientContext||{};
    const ctxKeys=Object.entries(ctx).filter(([,v])=>v).map(([k])=>k);
    const ctxLabels={pregnancy:'Pregnant',renal:'Renal Disease',hepatic:'Liver Disease',elderly:'Elderly',asthma:'Asthma',pepticUlcer:'Peptic Ulcer',dengue:'Dengue',ckd:'CKD'};
    const medRows=meds.map((m,i)=>`<tr><td><span class="med-num">${i+1}</span><strong>${esc(m.name)}</strong></td><td><span class="dose-badge">${esc(m.dose)||'—'}</span></td><td>${esc(m.duration)||'—'}</td><td>${m.instructions?`<span class="inst-badge">${esc(m.instructions)}</span>`:'—'}</td></tr>`).join('');
    const ctxHTML=ctxKeys.length?`<div class="rx-ctx-tags">${ctxKeys.map(k=>`<span class="ctx-tag">⚠️ ${ctxLabels[k]||k}</span>`).join('')}</div>`:'';
    document.getElementById('rxPaper').innerHTML=`
        <div class="rx-stripe"></div>
        <div class="rx-body">
            <div class="rx-header">
                <div><div class="rx-brand">CurePd Rx</div><div class="rx-brand-sub">Digital Prescription Platform · Bangladesh</div></div>
                <div><div class="rx-dr-name">Dr. ${esc(dr.name||'Doctor')}</div>
                <div class="rx-dr-detail">${dr.registration?`BMDC: ${esc(dr.registration)}<br>`:''}${dr.speciality?`${esc(dr.speciality)}<br>`:''}${dr.clinic?esc(dr.clinic):''}</div></div>
            </div>
            <div class="rx-patient-band">
                <div><div class="rpf-label">Patient Name</div><div class="rpf-val">${esc(pres.patientName)||'—'}</div></div>
                <div><div class="rpf-label">Age / Gender</div><div class="rpf-val">${esc(pres.patientAge)||'—'}${pres.patientGender?' / '+esc(pres.patientGender):''}</div></div>
                <div><div class="rpf-label">Phone</div><div class="rpf-val">${esc(pres.patientPhone)||'—'}</div></div>
                <div><div class="rpf-label">Date</div><div class="rpf-val">${fmtDate(pres.date)}</div></div>
            </div>
            ${ctxHTML}
            ${(pres.complaint||pres.diagnosis)?`<div class="rx-clinical">${pres.complaint?`<div class="rx-cbox"><div class="rx-clabel">Chief Complaint</div><div class="rx-cval">${esc(pres.complaint)}</div></div>`:'<div></div>'}${pres.diagnosis?`<div class="rx-cbox"><div class="rx-clabel">Diagnosis</div><div class="rx-cval">${esc(pres.diagnosis)}</div></div>`:'<div></div>'}</div>`:''}
            <div class="rx-section-title"><i class="fas fa-pills"></i> Medicines</div>
            ${meds.length?`<table class="rx-med-table"><thead><tr><th>Medicine</th><th>Dosage</th><th>Duration</th><th>Instructions</th></tr></thead><tbody>${medRows}</tbody></table>`:`<p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">No medicines prescribed.</p>`}
            ${tests.length?`<div class="rx-section-title"><i class="fas fa-flask"></i> Lab Tests</div><div class="rx-tests">${tests.map(t=>`<span class="test-tag">${esc(t)}</span>`).join('')}</div>`:''}
            ${pres.advice?`<div class="rx-section-title"><i class="fas fa-comment-medical"></i> Advice</div><div class="rx-advice"><div class="rx-advice-text"><i class="fas fa-exclamation-circle" style="margin-right:6px;"></i>${esc(pres.advice)}</div></div>`:''}
            ${pres.followupDate?`<div class="rx-followup"><i class="fas fa-calendar-check"></i> Follow-up: <strong>${fmtDate(pres.followupDate)}</strong></div>`:''}
            <div class="rx-footer">
                <div class="rx-footer-left">Digitally generated by CurePd Rx · Valid without physical signature<div class="rx-id">RX-ID: ${esc(pres.id)}</div></div>
                <div style="text-align:right;"><div style="font-size:10px;color:var(--text-muted);margin-bottom:5px;">Scan to verify</div><div id="qrInPaper"></div></div>
            </div>
        </div>`;
    if(typeof QRCode!=='undefined'){new QRCode(document.getElementById('qrInPaper'),{text:window.location.href,width:56,height:56,colorDark:'#0d1b2a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L});}
}

function buildPatientAnalysis(pres){
    const meds=pres.medicines||[];
    if(!meds.length)return;
    const ctx=pres.patientContext||{};
    const medCards=meds.map(m=>{
        const info=MedicineRegistry.get(m.name);
        const safety=MedicineRegistry.isSafeFor(m.name,ctx);
        const key=esc(m.name).replace(/[^a-zA-Z0-9]/g,'_');
        const warnHTML=safety.warnings.length>0?safety.warnings.map(w=>`<div class="safety-warn"><i class="fas fa-exclamation-triangle"></i> ${esc(w.replace(/[⚠️⛔]/g,'').trim())}</div>`).join(''):'';
        const bodyHTML=info?`
            <div class="me-row"><div class="me-ico blue"><i class="fas fa-info-circle"></i></div><div><div class="me-lbl">Why this medicine</div><div class="me-txt">${esc(info.patientNote||info.caution||'As prescribed.')}</div></div></div>
            <div class="me-row"><div class="me-ico green"><i class="fas fa-clock"></i></div><div><div class="me-lbl">Best time to take</div><div class="me-txt">${esc(m.instructions||info.timing||'As directed')}</div></div></div>
            <div class="me-row"><div class="me-ico amber"><i class="fas fa-exclamation-triangle"></i></div><div><div class="me-lbl">Important caution</div><div class="me-txt">${esc(info.caution||'Follow your doctor\'s instructions.')}</div></div></div>
            ${warnHTML?`<div class="me-row"><div class="me-ico red"><i class="fas fa-shield-alt"></i></div><div><div class="me-lbl">Safety alert</div>${warnHTML}</div></div>`:''}`:`
            <div class="me-row"><div class="me-ico blue"><i class="fas fa-info-circle"></i></div><div><div class="me-txt">Take exactly as prescribed. Complete the full course if antibiotic.</div></div></div>
            ${warnHTML?`<div class="me-row"><div class="me-ico red"><i class="fas fa-shield-alt"></i></div><div><div class="me-lbl">Safety alert</div>${warnHTML}</div></div>`:''}`;
        return`<div class="med-explain"><div class="me-hd" onclick="toggleMed('${key}')"><div><div class="me-name">${esc(m.name)}</div><div class="me-meta">${m.dose?'Dose: '+esc(m.dose):''}${m.duration?' · '+esc(m.duration):''}${m.instructions?' · '+esc(m.instructions):''}${info?' · '+esc(info.generic):''}${safety.warnings.length?' <span style="color:#f59e0b;font-weight:600;">⚠️ Caution</span>':''}</div></div><i class="fas fa-chevron-down me-chev" id="chev-${key}"></i></div><div class="me-bd" id="mb-${key}">${bodyHTML}</div></div>`;
    }).join('');
    document.getElementById('aiSection').innerHTML=`
        <div class="ai-analysis">
            <div class="ai-analysis-hd"><i class="fas fa-robot"></i><div><h3>Patient Health Guide</h3><p>Understand your medicines in simple language — no medical knowledge needed</p></div></div>
            <div class="ai-analysis-bd">
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);margin-bottom:12px;"><i class="fas fa-pills" style="color:var(--teal)"></i> Your Medicines Explained</div>
                ${medCards}
                <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border);">
                    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);margin-bottom:6px;"><i class="fas fa-robot" style="color:var(--teal)"></i> AI Plain-Language Health Summary</div>
                    <div id="aiPatientSummary">Tap below to get a simple explanation of your health condition and treatment.</div>
                    <button class="ai-load-btn" id="aiPatientBtn"><i class="fas fa-magic"></i> Explain My Prescription in Simple Language</button>
                </div>
            </div>
        </div>`;
    document.getElementById('aiPatientBtn').addEventListener('click',()=>loadAISummary(pres));
}

function toggleMed(key){
    const b=document.getElementById(`mb-${key}`),c=document.getElementById(`chev-${key}`);
    if(!b)return;
    const open=b.classList.toggle('open');
    if(c)c.style.transform=open?'rotate(180deg)':'rotate(0)';
}

async function loadAISummary(pres){
    const btn=document.getElementById('aiPatientBtn');
    btn.innerHTML='<i class="fas fa-spinner fa-pulse"></i> Generating...';btn.disabled=true;
    const meds=(pres.medicines||[]).map(m=>`${m.name}(${m.dose||'?'},${m.duration||'?'},${m.instructions||'as directed'})`).join('; ');
    const ctx=pres.patientContext||{};
    const ctxStr=Object.entries(ctx).filter(([,v])=>v).map(([k])=>k).join(', ')||'none';
    const prompt=`A patient in Bangladesh received this prescription. Explain in simple, warm language a non-medical person can understand.
Diagnosis: ${pres.diagnosis||'N/A'}. Complaint: ${pres.complaint||'N/A'}. Age: ${pres.patientAge||'N/A'}, Gender: ${pres.patientGender||'N/A'}. Risk factors: ${ctxStr}.
Medicines: ${meds||'N/A'}. Tests: ${pres.labTests||'None'}. Advice: ${pres.advice||'None'}. Follow-up: ${pres.followupDate||'N/A'}.
Write 3-4 short paragraphs: 1) What health problem in simple words, 2) What medicines do briefly, 3) Important reminders (timing, food, warnings), 4) When to seek emergency care. Warm, clear, simple English. No jargon.`;
    try{
        const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:prompt}]})});
        const data=await res.json();
        const txt=data.content?.[0]?.text||'Could not generate.';
        const el=document.getElementById('aiPatientSummary');
        el.style.fontStyle='normal';el.style.color='var(--text-main)';
        el.innerHTML=txt.split('\n\n').filter(p=>p.trim()).map(p=>`<p style="margin-bottom:10px;line-height:1.75;">${esc(p)}</p>`).join('');
        btn.innerHTML='<i class="fas fa-check-circle"></i> Generated';btn.style.background='#10b981';btn.style.boxShadow='none';
    }catch(e){
        document.getElementById('aiPatientSummary').textContent='AI temporarily unavailable. Try again.';
        btn.innerHTML='<i class="fas fa-magic"></i> Try Again';btn.disabled=false;
    }
}

function buildSidebar(pres,tests){
    const rxUrl=window.location.href;
    const sidebar=document.getElementById('sidebar');
    sidebar.style.display='flex';
    const ctx=pres.patientContext||{};
    const ctxFlags=Object.entries(ctx).filter(([,v])=>v).map(([k])=>k);
    const ctxLabels={pregnancy:'Pregnant',renal:'Renal Disease',hepatic:'Liver Disease',elderly:'Elderly 65+',asthma:'Asthma',pepticUlcer:'Peptic Ulcer',dengue:'Dengue',ckd:'CKD'};
    sidebar.innerHTML=`
        <div class="qr-card">
            <div class="qr-label"><i class="fas fa-qrcode"></i> Share Prescription</div>
            <div id="qrcode"></div>
            <div class="qr-link">${esc(rxUrl)}</div>
            <button class="copy-btn" id="copyBtn"><i class="fas fa-copy"></i> Copy Share Link</button>
            <p style="font-size:11px;color:var(--text-muted);margin-top:10px;line-height:1.6;">Patient scans QR to view prescription and health guide — no login needed.</p>
        </div>
        <div class="info-card">
            <div class="ic-label">Prescription Info</div>
            <div class="info-row"><span class="ir-l">Status</span><span class="badge-g">✓ Saved</span></div>
            <div class="info-row"><span class="ir-l">Date</span><span class="ir-v">${fmtDate(pres.date)}</span></div>
            <div class="info-row"><span class="ir-l">Medicines</span><span class="ir-v">${(pres.medicines||[]).length} items</span></div>
            <div class="info-row"><span class="ir-l">Lab Tests</span><span class="ir-v">${tests.length>0?tests.length+' ordered':'None'}</span></div>
            ${pres.followupDate?`<div class="info-row"><span class="ir-l">Follow-up</span><span class="ir-v">${fmtDate(pres.followupDate)}</span></div>`:''}
            ${ctxFlags.length>0?`<div class="info-row" style="flex-direction:column;align-items:flex-start;gap:5px;"><span class="ir-l">Risk Flags</span><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">${ctxFlags.map(k=>`<span class="badge-a">${ctxLabels[k]||k}</span>`).join('')}</div></div>`:''}
        </div>
        <div class="act-card">
            <div class="ic-label">Actions</div>
            <div class="act-item" id="actPrint"><div class="act-ico" style="background:rgba(15,169,158,.1);color:var(--teal)"><i class="fas fa-print"></i></div><div><div class="act-lbl">Print</div><div class="act-sub">Print prescription</div></div></div>
            <div class="act-item" id="actPdf"><div class="act-ico" style="background:var(--bg);color:var(--text-muted)"><i class="fas fa-file-pdf"></i></div><div><div class="act-lbl">Download PDF</div><div class="act-sub">Save to device</div></div></div>
            <div class="act-item" id="actShare"><div class="act-ico" style="background:rgba(59,130,246,.1);color:#3b82f6"><i class="fas fa-share-alt"></i></div><div><div class="act-lbl">Copy Link</div><div class="act-sub">Send to patient</div></div></div>
        </div>`;
    if(typeof QRCode!=='undefined'){new QRCode(document.getElementById('qrcode'),{text:rxUrl,width:148,height:148,colorDark:'#0d1b2a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}
    document.getElementById('copyBtn').addEventListener('click',()=>{navigator.clipboard.writeText(rxUrl).then(()=>toast('✅ Link copied!'));});
    document.getElementById('actShare').addEventListener('click',()=>{navigator.clipboard.writeText(rxUrl).then(()=>toast('✅ Link copied!'));});
    document.getElementById('actPrint').addEventListener('click',()=>window.print());
    document.getElementById('actPdf').addEventListener('click',()=>downloadPDF(pres));
}

function downloadPDF(pres){
    html2pdf().set({margin:[0.4,0.4,0.4,0.4],filename:`CurePdRx_${(pres.patientName||'rx').replace(/\s/g,'_')}.pdf`,image:{type:'jpeg',quality:.98},html2canvas:{scale:2},jsPDF:{unit:'in',format:'a4',orientation:'portrait'}}).from(document.getElementById('rxPaper')).save();
}

async function init(){
    const id=new URLSearchParams(window.location.search).get('id');
    if(!id){document.getElementById('rxPaper').innerHTML=`<div class="state-box"><i class="fas fa-exclamation-circle" style="color:#fca5a5"></i><h3>No Prescription ID</h3><p>Please provide a valid ID in the URL.</p><a href="dashboard.html">← Back to Dashboard</a></div>`;return;}
    try{
        const snap=await db.collection('prescriptions').doc(id).get();
        if(!snap.exists){document.getElementById('rxPaper').innerHTML=`<div class="state-box"><i class="fas fa-search-minus"></i><h3>Not Found</h3><p>No prescription with this ID.</p><a href="dashboard.html">← Back to Dashboard</a></div>`;return;}
        const pres={id:snap.id,...snap.data()};
        let dr={name:'Doctor',registration:'',speciality:'',clinic:''};
        if(pres.doctorId){const ds=await db.collection('doctors').doc(pres.doctorId).get();if(ds.exists)dr=ds.data();}
        const tests=pres.labTests?pres.labTests.split(',').map(t=>t.trim()).filter(Boolean):[];
        renderPaper(pres,dr);
        buildPatientAnalysis(pres);
        buildSidebar(pres,tests);
        document.getElementById('printBtn').addEventListener('click',()=>window.print());
        document.getElementById('pdfBtn').addEventListener('click',()=>downloadPDF(pres));
        document.getElementById('shareBtn').addEventListener('click',()=>{navigator.clipboard.writeText(window.location.href).then(()=>toast('✅ Link copied!'));});
    }catch(err){document.getElementById('rxPaper').innerHTML=`<div class="state-box"><i class="fas fa-server" style="color:#fca5a5"></i><h3>Error</h3><p>${esc(err.message)}</p></div>`;}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body>
</html>
