<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurePd Rx — Prescription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <style>
        :root {
            --navy: #0d1b2a; --teal: #0fa99e; --teal-light: #13c4b8;
            --text-main: #1a2332; --text-muted: #6b7a8d;
            --border: #e0e6ef; --bg: #f4f7fb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); }

        /* NAVBAR */
        .navbar {
            background: var(--navy); height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.18);
        }
        .nav-left { display: flex; align-items: center; gap: 18px; }
        .back-link {
            display: flex; align-items: center; gap: 6px;
            color: rgba(255,255,255,0.55); font-size: 13px;
            text-decoration: none; transition: color 0.2s;
        }
        .back-link:hover { color: white; }
        .nav-title {
            font-family: 'DM Serif Display', serif;
            font-size: 18px; color: white;
        }
        .nav-title span { color: var(--teal-light); }
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .btn-outline {
            height: 36px; padding: 0 16px; border-radius: 9px;
            border: 1.5px solid rgba(255,255,255,0.2);
            background: transparent; color: rgba(255,255,255,0.75);
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s; text-decoration: none;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.08); color: white; }
        .btn-teal {
            height: 36px; padding: 0 18px; border-radius: 9px;
            background: var(--teal); color: white; border: none;
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 10px rgba(15,169,158,0.35);
        }
        .btn-share {
            height: 36px; padding: 0 16px; border-radius: 9px;
            background: rgba(15,169,158,0.15); color: var(--teal-light);
            border: 1px solid rgba(15,169,158,0.3);
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .btn-share:hover { background: rgba(15,169,158,0.25); }

        /* LAYOUT */
        .page-wrap {
            max-width: 960px; margin: 0 auto;
            padding: 28px 20px;
            display: grid; grid-template-columns: 1fr 280px;
            gap: 20px; align-items: start;
        }

        /* ═══ PRESCRIPTION PAPER ═══ */
        .rx-paper {
            background: white; border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        /* Top accent stripe */
        .rx-stripe {
            height: 5px;
            background: linear-gradient(90deg, var(--teal) 0%, var(--teal-light) 100%);
        }

        .rx-body { padding: 32px 36px; }

        /* Header */
        .rx-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding-bottom: 20px; margin-bottom: 24px;
            border-bottom: 1.5px solid var(--border);
        }
        .rx-brand-name {
            font-family: 'DM Serif Display', serif;
            font-size: 26px; color: var(--teal); line-height: 1;
        }
        .rx-brand-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .rx-doctor-block { text-align: right; }
        .rx-dr-name {
            font-size: 15px; font-weight: 600; color: var(--text-main);
        }
        .rx-dr-detail { font-size: 12px; color: var(--text-muted); line-height: 1.7; }

        /* Patient info band */
        .rx-patient-band {
            background: #f8fafc; border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 18px;
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 12px; margin-bottom: 24px;
        }
        .rx-pfield-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 3px;
        }
        .rx-pfield-val { font-size: 14px; font-weight: 500; color: var(--text-main); }

        /* Section title */
        .rx-section-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--teal); margin-bottom: 10px;
            display: flex; align-items: center; gap: 7px;
        }
        .rx-section-title::after {
            content: ''; flex: 1; height: 1px; background: rgba(15,169,158,0.2);
        }

        /* Complaint / diagnosis */
        .rx-clinical-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            margin-bottom: 24px;
        }
        .rx-clinical-box {
            background: var(--bg); border-radius: 9px;
            padding: 13px 16px;
        }
        .rx-clinical-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 5px;
        }
        .rx-clinical-val { font-size: 13px; color: var(--text-main); line-height: 1.5; }

        /* Medicines table */
        .rx-med-table {
            width: 100%; border-collapse: collapse; margin-bottom: 24px;
        }
        .rx-med-table th {
            padding: 9px 12px; text-align: left;
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.7px; color: var(--text-muted);
            background: var(--bg); border-bottom: 1px solid var(--border);
        }
        .rx-med-table td {
            padding: 11px 12px; font-size: 13px; color: var(--text-main);
            border-bottom: 1px solid #f0f3f8; vertical-align: top;
        }
        .rx-med-table tr:last-child td { border-bottom: none; }
        .med-num {
            width: 22px; height: 22px; border-radius: 50%;
            background: rgba(15,169,158,0.1); color: var(--teal);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; margin-right: 6px;
        }

        /* Dose badge */
        .dose-badge {
            display: inline-block; background: var(--navy);
            color: var(--teal-light); font-size: 11px; font-weight: 600;
            padding: 2px 8px; border-radius: 5px; font-family: monospace;
        }

        /* Lab tests */
        .rx-tests {
            background: var(--bg); border-radius: 9px; padding: 13px 16px;
            margin-bottom: 20px;
        }
        .test-tag {
            display: inline-block; background: white;
            border: 1px solid var(--border); border-radius: 6px;
            padding: 3px 10px; font-size: 12px; color: var(--text-main);
            margin: 3px 4px 3px 0;
        }

        /* Advice */
        .rx-advice {
            background: #fffbeb; border: 1px solid #fde68a;
            border-radius: 9px; padding: 13px 16px; margin-bottom: 20px;
        }
        .rx-advice-text { font-size: 13px; color: #92400e; line-height: 1.6; }

        /* Follow-up */
        .rx-followup {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(15,169,158,0.06); border: 1px solid rgba(15,169,158,0.2);
            border-radius: 8px; padding: 8px 14px;
            font-size: 13px; color: var(--teal); margin-bottom: 24px;
        }

        /* Footer */
        .rx-footer {
            border-top: 1px solid var(--border); padding-top: 16px;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .rx-footer-left { font-size: 11px; color: var(--text-muted); }
        .rx-id {
            font-family: monospace; font-size: 11px;
            background: var(--bg); padding: 3px 8px; border-radius: 5px;
            color: var(--text-muted); display: inline-block; margin-top: 4px;
        }

        /* ═══ SIDEBAR ═══ */
        .sidebar { display: flex; flex-direction: column; gap: 16px; }

        /* QR Card */
        .qr-card {
            background: white; border-radius: 14px;
            border: 1px solid var(--border);
            padding: 20px; text-align: center;
        }
        .qr-label {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 14px;
        }
        #qrcode { display: flex; justify-content: center; margin-bottom: 12px; }
        #qrcode canvas, #qrcode img { border-radius: 8px; }
        .qr-link {
            font-size: 11px; color: var(--text-muted); word-break: break-all;
            background: var(--bg); padding: 8px 10px; border-radius: 7px;
            margin-bottom: 12px; display: block; text-align: left;
        }
        .copy-btn {
            width: 100%; height: 36px; border-radius: 9px;
            background: rgba(15,169,158,0.08); color: var(--teal);
            border: 1.5px solid rgba(15,169,158,0.2);
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: var(--teal); color: white; border-color: var(--teal); }

        /* Status card */
        .status-card {
            background: white; border-radius: 14px;
            border: 1px solid var(--border); padding: 18px;
        }
        .status-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #f0f3f8;
        }
        .status-row:last-child { border-bottom: none; }
        .status-label { font-size: 12px; color: var(--text-muted); }
        .status-val { font-size: 12px; font-weight: 500; color: var(--text-main); }
        .status-badge {
            font-size: 10px; padding: 2px 8px; border-radius: 5px; font-weight: 600;
        }
        .badge-green { background: #d1fae5; color: #065f46; }

        /* Actions card */
        .action-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 10px;
            cursor: pointer; transition: all 0.2s;
            margin-bottom: 6px;
        }
        .action-item:last-child { margin-bottom: 0; }
        .action-item:hover { background: var(--bg); }
        .ai-icon {
            width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .ai-label { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .ai-sub { font-size: 11px; color: var(--text-muted); }

        /* Loading / error states */
        .loading-state, .error-state {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 300px; color: var(--text-muted);
        }
        .loading-state i { font-size: 36px; margin-bottom: 12px; color: var(--teal); }
        .error-state i { font-size: 48px; margin-bottom: 12px; color: #fca5a5; }
        .error-state h3 { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            background: var(--navy); color: white; padding: 12px 22px;
            border-radius: 12px; font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 9px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            opacity: 0; pointer-events: none; z-index: 999; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .toast i { color: #4ade80; }

        /* ═══ PRINT STYLES ═══ */
        @media print {
            .navbar, .sidebar, body > .toast { display: none !important; }
            body { background: white; }
            .page-wrap { display: block; padding: 0; }
            .rx-paper { border: none; border-radius: 0; box-shadow: none; }
            .rx-body { padding: 20px 24px; }
            .rx-stripe { display: none; }
        }

        @media (max-width: 768px) {
            .page-wrap { grid-template-columns: 1fr; }
            .rx-patient-band { grid-template-columns: repeat(2, 1fr); }
            .rx-clinical-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-left">
        <a href="dashboard.html" class="back-link no-print">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <div class="nav-title">CurePd <span>Rx</span> — View Prescription</div>
    </div>
    <div class="nav-actions no-print">
        <button class="btn-share" id="shareLinkBtn"><i class="fas fa-share-alt"></i> Share Link</button>
        <button class="btn-outline" id="printBtn"><i class="fas fa-print"></i> Print</button>
        <button class="btn-outline" id="pdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>
    </div>
</nav>

<div class="page-wrap" id="pageWrap">
    <!-- Will be populated by JS -->
    <div class="rx-paper">
        <div class="loading-state">
            <i class="fas fa-spinner fa-pulse"></i>
            <p>Loading prescription...</p>
        </div>
    </div>
    <div class="sidebar" style="display:none;" id="sidebar"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
    function esc(s) {
        if (!s) return '';
        return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function fmtDate(d) {
        if (!d) return '—';
        const [y,m,day] = d.split('-');
        return day ? `${day}/${m}/${y}` : d;
    }

    function toast(msg) {
        document.getElementById('toastMsg').textContent = msg;
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function buildQR(url) {
        const container = document.getElementById('qrcode');
        if (!container) return;
        new QRCode(container, {
            text: url, width: 140, height: 140,
            colorDark: '#0d1b2a', colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
        });
    }

    function renderPrescription(pres, dr) {
        const rxUrl = window.location.href;
        const meds = (pres.medicines || []);
        const tests = pres.labTests ? pres.labTests.split(',').map(t => t.trim()).filter(Boolean) : [];

        // Build prescription paper
        const paper = document.querySelector('.rx-paper');
        paper.innerHTML = `
            <div class="rx-stripe"></div>
            <div class="rx-body">

                <!-- Header -->
                <div class="rx-header">
                    <div>
                        <div class="rx-brand-name">CurePd Rx</div>
                        <div class="rx-brand-sub">Digital Prescription Platform · Bangladesh</div>
                    </div>
                    <div class="rx-doctor-block">
                        <div class="rx-dr-name">Dr. ${esc(dr.name)}</div>
                        <div class="rx-dr-detail">
                            ${dr.registration ? `BMDC Reg: ${esc(dr.registration)}<br>` : ''}
                            ${dr.speciality ? `${esc(dr.speciality)}<br>` : ''}
                            ${dr.clinic ? esc(dr.clinic) : ''}
                        </div>
                    </div>
                </div>

                <!-- Patient band -->
                <div class="rx-patient-band">
                    <div>
                        <div class="rx-pfield-label">Patient Name</div>
                        <div class="rx-pfield-val">${esc(pres.patientName) || '—'}</div>
                    </div>
                    <div>
                        <div class="rx-pfield-label">Age / Gender</div>
                        <div class="rx-pfield-val">${esc(pres.patientAge)||'—'} ${pres.patientGender?'/ '+esc(pres.patientGender):''}</div>
                    </div>
                    <div>
                        <div class="rx-pfield-label">Phone</div>
                        <div class="rx-pfield-val">${esc(pres.patientPhone)||'—'}</div>
                    </div>
                    <div>
                        <div class="rx-pfield-label">Date</div>
                        <div class="rx-pfield-val">${fmtDate(pres.date)}</div>
                    </div>
                </div>

                <!-- Complaint & Diagnosis -->
                ${(pres.complaint || pres.diagnosis) ? `
                <div class="rx-clinical-row">
                    ${pres.complaint ? `
                    <div class="rx-clinical-box">
                        <div class="rx-clinical-label">Chief Complaint</div>
                        <div class="rx-clinical-val">${esc(pres.complaint)}</div>
                    </div>` : '<div></div>'}
                    ${pres.diagnosis ? `
                    <div class="rx-clinical-box">
                        <div class="rx-clinical-label">Diagnosis / Impression</div>
                        <div class="rx-clinical-val">${esc(pres.diagnosis)}</div>
                    </div>` : '<div></div>'}
                </div>` : ''}

                <!-- Medicines -->
                <div class="rx-section-title"><i class="fas fa-pills"></i> Medicines</div>
                ${meds.length > 0 ? `
                <table class="rx-med-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Medicine</th>
                            <th>Dosage</th>
                            <th>Duration</th>
                            <th>Instructions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${meds.map((m,i) => `
                        <tr>
                            <td><span class="med-num">${i+1}</span></td>
                            <td style="font-weight:600;">${esc(m.name)}</td>
                            <td><span class="dose-badge">${esc(m.dose)||'—'}</span></td>
                            <td>${esc(m.duration)||'—'}</td>
                            <td style="color:var(--text-muted)">${esc(m.instructions)||'—'}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>` : '<p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">No medicines prescribed.</p>'}

                <!-- Lab Tests -->
                ${tests.length > 0 ? `
                <div class="rx-section-title" style="margin-top:4px;"><i class="fas fa-flask"></i> Lab Tests</div>
                <div class="rx-tests" style="margin-bottom:20px;">
                    ${tests.map(t => `<span class="test-tag">${esc(t)}</span>`).join('')}
                </div>` : ''}

                <!-- Advice -->
                ${pres.advice ? `
                <div class="rx-section-title"><i class="fas fa-comment-medical"></i> Advice</div>
                <div class="rx-advice">
                    <div class="rx-advice-text"><i class="fas fa-exclamation-circle" style="margin-right:6px;"></i>${esc(pres.advice)}</div>
                </div>` : ''}

                <!-- Follow-up -->
                ${pres.followupDate ? `
                <div class="rx-followup">
                    <i class="fas fa-calendar-check"></i>
                    <span>Follow-up scheduled: <strong>${fmtDate(pres.followupDate)}</strong></span>
                </div>` : ''}

                <!-- Footer -->
                <div class="rx-footer">
                    <div class="rx-footer-left">
                        <div>Digitally generated by CurePd Rx · Valid without physical signature</div>
                        <div class="rx-id">RX-ID: ${esc(pres.id)}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:11px;color:var(--text-muted);">Verify this prescription</div>
                        <div id="qrInPaper" style="margin-top:6px;"></div>
                    </div>
                </div>

            </div>
        `;

        // QR in paper footer (small, for print)
        new QRCode(document.getElementById('qrInPaper'), {
            text: rxUrl, width: 64, height: 64,
            colorDark: '#0d1b2a', colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.L
        });

        // Build sidebar
        const sidebar = document.getElementById('sidebar');
        sidebar.style.display = 'flex';
        sidebar.innerHTML = `
            <!-- QR Card -->
            <div class="qr-card">
                <div class="qr-label"><i class="fas fa-qrcode"></i> Share QR Code</div>
                <div id="qrcode"></div>
                <div class="qr-link">${esc(rxUrl)}</div>
                <button class="copy-btn" id="copyLinkBtn">
                    <i class="fas fa-copy"></i> Copy Link
                </button>
                <div style="font-size:11px;color:var(--text-muted);margin-top:10px;line-height:1.5;">
                    Patient scans this QR code to view the prescription without any login.
                </div>
            </div>

            <!-- Status -->
            <div class="status-card">
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:10px;">Prescription Info</div>
                <div class="status-row">
                    <span class="status-label">Status</span>
                    <span class="status-badge badge-green">✓ Saved</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Date</span>
                    <span class="status-val">${fmtDate(pres.date)}</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Medicines</span>
                    <span class="status-val">${meds.length} item${meds.length!==1?'s':''}</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Tests</span>
                    <span class="status-val">${tests.length > 0 ? tests.length+' ordered' : 'None'}</span>
                </div>
                ${pres.followupDate ? `
                <div class="status-row">
                    <span class="status-label">Follow-up</span>
                    <span class="status-val">${fmtDate(pres.followupDate)}</span>
                </div>` : ''}
            </div>

            <!-- Actions -->
            <div class="status-card">
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:6px;">Actions</div>
                <div class="action-item" id="act-print">
                    <div class="ai-icon" style="background:rgba(15,169,158,0.1);color:var(--teal)"><i class="fas fa-print"></i></div>
                    <div><div class="ai-label">Print</div><div class="ai-sub">Print this prescription</div></div>
                </div>
                <div class="action-item" id="act-pdf">
                    <div class="ai-icon" style="background:#f3f4f6;color:#6b7280"><i class="fas fa-file-pdf"></i></div>
                    <div><div class="ai-label">Download PDF</div><div class="ai-sub">Save as PDF</div></div>
                </div>
                <div class="action-item" id="act-share">
                    <div class="ai-icon" style="background:rgba(59,130,246,0.1);color:#3b82f6"><i class="fas fa-share-alt"></i></div>
                    <div><div class="ai-label">Share Link</div><div class="ai-sub">Copy shareable URL</div></div>
                </div>
            </div>
        `;

        // Build QR in sidebar
        buildQR(rxUrl);

        // Event bindings
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(rxUrl).then(() => toast('✅ Link copied to clipboard!'));
        });
        document.getElementById('act-print').addEventListener('click', () => window.print());
        document.getElementById('act-share').addEventListener('click', () => {
            navigator.clipboard.writeText(rxUrl).then(() => toast('✅ Link copied!'));
        });
        document.getElementById('act-pdf').addEventListener('click', () => downloadPDF(pres, dr));
    }

    function downloadPDF(pres, dr) {
        const element = document.querySelector('.rx-paper');
        const opt = {
            margin: [0.4, 0.4, 0.4, 0.4],
            filename: `CurePdRx_${(pres.patientName||'prescription').replace(/\s/g,'_')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    async function loadPrescription() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) {
            document.querySelector('.rx-paper').innerHTML = `
                <div class="error-state">
                    <i class="fas fa-exclamation-circle" style="color:#fca5a5"></i>
                    <h3>No Prescription ID</h3>
                    <p style="font-size:13px;color:var(--text-muted);">Please provide a valid prescription ID in the URL.</p>
                    <a href="dashboard.html" style="margin-top:16px;color:var(--teal);font-size:13px;">← Back to Dashboard</a>
                </div>`;
            return;
        }

        try {
            const docSnap = await db.collection('prescriptions').doc(id).get();
            if (!docSnap.exists) {
                document.querySelector('.rx-paper').innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-search-minus"></i>
                        <h3>Prescription Not Found</h3>
                        <p style="font-size:13px;color:var(--text-muted);">The ID "${esc(id)}" does not exist.</p>
                        <a href="dashboard.html" style="margin-top:16px;color:var(--teal);font-size:13px;">← Back to Dashboard</a>
                    </div>`;
                return;
            }

            const pres = { id: docSnap.id, ...docSnap.data() };
            let dr = { name: 'Doctor', registration: '', speciality: '', clinic: '' };

            if (pres.doctorId) {
                const drSnap = await db.collection('doctors').doc(pres.doctorId).get();
                if (drSnap.exists) dr = drSnap.data();
            }

            renderPrescription(pres, dr);

            // Bind navbar buttons
            document.getElementById('printBtn').addEventListener('click', () => window.print());
            document.getElementById('pdfBtn').addEventListener('click', () => downloadPDF(pres, dr));
            document.getElementById('shareLinkBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(window.location.href).then(() => toast('✅ Link copied to clipboard!'));
            });

        } catch(err) {
            document.querySelector('.rx-paper').innerHTML = `
                <div class="error-state">
                    <i class="fas fa-server"></i>
                    <h3>Error Loading</h3>
                    <p style="font-size:13px;color:var(--text-muted);">${esc(err.message)}</p>
                </div>`;
        }
    }

    // Load on ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadPrescription);
    } else {
        loadPrescription();
    }
</script>
</body>
</html>
