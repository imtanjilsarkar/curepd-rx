<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurePd Rx - View Prescription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; }
        .prescription-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            padding: 2rem;
            max-width: 850px;
            margin: 0 auto;
        }
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            .prescription-card { box-shadow: none; padding: 1rem; }
        }
        .medicine-table { width: 100%; border-collapse: collapse; }
        .medicine-table th, .medicine-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .medicine-table th { background-color: #f9fafb; font-weight: 600; }
        .prescription-id { font-family: monospace; background: #f3f4f6; padding: 4px 8px; border-radius: 8px; }
    </style>
</head>
<body class="p-4">
    <!-- Top actions (no-print) -->
    <div class="max-w-4xl mx-auto mb-4 no-print">
        <div class="flex flex-wrap justify-between items-center gap-3">
            <a href="dashboard.html" class="text-indigo-600 hover:text-indigo-800 bg-white px-4 py-2 rounded-lg shadow-sm">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
            <div class="flex gap-3">
                <button id="downloadPdfBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2">
                    <i class="fas fa-download"></i> Download PDF
                </button>
                <button onclick="window.print()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2">
                    <i class="fas fa-print"></i> Print
                </button>
            </div>
        </div>
    </div>

    <!-- Prescription container -->
    <div id="prescriptionContainer" class="prescription-card">
        <div class="text-center py-12">
            <i class="fas fa-spinner fa-pulse text-3xl text-indigo-500"></i>
            <p class="mt-3 text-gray-500">Loading prescription...</p>
        </div>
    </div>

    <script>
        // Helper: escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Format date (YYYY-MM-DD to DD/MM/YYYY)
        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateStr;
        }

        // Render prescription HTML
        function renderPrescription(pres, doctorName = 'Doctor', doctorReg = '', doctorClinic = '') {
            const medicines = pres.medicines || [];
            const medRows = medicines.map(m => `
                <tr>
                    <td class="font-medium">${escapeHtml(m.name)}</td>
                    <td>${escapeHtml(m.dose) || '—'}</td>
                    <td>${escapeHtml(m.duration) || '—'}</td>
                </tr>
            `).join('');

            const noMedicinesRow = medicines.length === 0 ? `
                <tr><td colspan="3" class="text-center text-gray-400 italic py-4">No medicines prescribed</td></tr>
            ` : '';

            return `
                <div class="border-b border-gray-200 pb-4 mb-4 flex justify-between items-start flex-wrap gap-3">
                    <div>
                        <h1 class="text-2xl font-bold text-indigo-700">CurePd Rx</h1>
                        <p class="text-sm text-gray-500">Digital Prescription System</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-semibold text-gray-800">Dr. ${escapeHtml(doctorName)}</p>
                        ${doctorReg ? `<p class="text-xs text-gray-500">${escapeHtml(doctorReg)}</p>` : ''}
                        ${doctorClinic ? `<p class="text-xs text-gray-500">${escapeHtml(doctorClinic)}</p>` : ''}
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6 bg-gray-50 p-4 rounded-xl">
                    <div>
                        <span class="text-xs font-semibold text-gray-500 uppercase">Patient Name</span>
                        <p class="text-lg font-medium text-gray-800">${escapeHtml(pres.patientName)}</p>
                    </div>
                    <div>
                        <span class="text-xs font-semibold text-gray-500 uppercase">Age</span>
                        <p class="text-lg text-gray-800">${escapeHtml(pres.patientAge) || '—'}</p>
                    </div>
                    <div>
                        <span class="text-xs font-semibold text-gray-500 uppercase">Phone</span>
                        <p class="text-lg text-gray-800">${escapeHtml(pres.patientPhone) || '—'}</p>
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Medicines</h3>
                    <table class="medicine-table">
                        <thead>
                            <tr><th>Medicine</th><th>Dosage</th><th>Duration</th></tr>
                        </thead>
                        <tbody>
                            ${medRows || noMedicinesRow}
                        </tbody>
                    </table>
                </div>

                ${pres.advice ? `
                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-2">Advice / Instructions</h3>
                    <div class="bg-gray-50 p-4 rounded-lg text-gray-700">
                        ${escapeHtml(pres.advice)}
                    </div>
                </div>
                ` : ''}

                <div class="border-t border-gray-200 pt-4 flex flex-wrap justify-between items-center text-sm text-gray-500">
                    <div>
                        <p class="text-xs">Digitally generated prescription</p>
                        <p class="text-xs">Valid without signature</p>
                    </div>
                    <div class="text-right">
                        <p>Date: <strong>${formatDate(pres.date)}</strong></p>
                        <p class="text-xs mt-1">Prescription ID: <span class="prescription-id">${pres.id}</span></p>
                    </div>
                </div>
            `;
        }

        // Load prescription and doctor info
        async function loadPrescription() {
            const urlParams = new URLSearchParams(window.location.search);
            const prescriptionId = urlParams.get('id');
            const container = document.getElementById('prescriptionContainer');

            if (!prescriptionId) {
                container.innerHTML = `
                    <div class="text-center py-8 text-red-600">
                        <i class="fas fa-exclamation-circle text-4xl mb-3"></i>
                        <h2 class="text-xl font-bold">No Prescription ID</h2>
                        <p>Please provide a valid prescription ID in the URL (e.g., ?id=XXX).</p>
                        <a href="dashboard.html" class="inline-block mt-4 text-indigo-600 underline">Go to Dashboard</a>
                    </div>
                `;
                return;
            }

            try {
                const docRef = db.collection('prescriptions').doc(prescriptionId);
                const docSnap = await docRef.get();

                if (!docSnap.exists) {
                    container.innerHTML = `
                        <div class="text-center py-8 text-red-600">
                            <i class="fas fa-search-minus text-4xl mb-3"></i>
                            <h2 class="text-xl font-bold">Prescription Not Found</h2>
                            <p>The ID "${escapeHtml(prescriptionId)}" does not exist in the database.</p>
                            <a href="dashboard.html" class="inline-block mt-4 text-indigo-600 underline">Back to Dashboard</a>
                        </div>
                    `;
                    return;
                }

                const pres = { id: docSnap.id, ...docSnap.data() };
                let doctorName = 'Doctor', doctorReg = '', doctorClinic = '';

                // Fetch doctor's name from Firestore if doctorId exists
                if (pres.doctorId) {
                    const doctorDoc = await db.collection('doctors').doc(pres.doctorId).get();
                    if (doctorDoc.exists) {
                        const docData = doctorDoc.data();
                        doctorName = docData.name || doctorName;
                        doctorReg = docData.registration || '';
                        doctorClinic = docData.clinic || '';
                    } else {
                        // fallback: use email from auth? optional
                        doctorName = pres.doctorId.substring(0, 8) + '...';
                    }
                }

                const renderedHtml = renderPrescription(pres, doctorName, doctorReg, doctorClinic);
                container.innerHTML = renderedHtml;

                // Attach PDF download after rendering
                const pdfBtn = document.getElementById('downloadPdfBtn');
                if (pdfBtn) {
                    pdfBtn.onclick = () => {
                        const element = container; // the prescription card
                        const opt = {
                            margin: [0.5, 0.5, 0.5, 0.5],
                            filename: `CurePdRx_${pres.patientName.replace(/\s/g, '_')}_${pres.id}.pdf`,
                            image: { type: 'jpeg', quality: 0.98 },
                            html2canvas: { scale: 2, letterRendering: true },
                            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
                        };
                        html2pdf().set(opt).from(element).save();
                    };
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="text-center py-8 text-red-600">
                        <i class="fas fa-server text-4xl mb-3"></i>
                        <h2 class="text-xl font-bold">Error Loading Prescription</h2>
                        <p>${escapeHtml(err.message)}</p>
                        <a href="dashboard.html" class="inline-block mt-4 text-indigo-600 underline">Back to Dashboard</a>
                    </div>
                `;
            }
        }

        // Wait for Firebase to be ready (firebase-init.js sets window.auth, window.db)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadPrescription);
        } else {
            loadPrescription();
        }
    </script>
</body>
</html>
