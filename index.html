<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurePd Rx - Doctor Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <i class="fas fa-prescription-bottle text-5xl text-indigo-600 mb-3"></i>
            <h1 class="text-3xl font-bold text-gray-800">CurePd Rx</h1>
            <p class="text-gray-500 mt-2">Digital Prescription for Modern Doctors</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 font-medium mb-1">Doctor Email</label>
                <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="doctor@clinic.com" required>
            </div>
            <div>
                <label class="block text-gray-700 font-medium mb-1">Password</label>
                <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="••••••" required>
                <div class="text-right mt-1">
                    <a href="#" id="forgotPassword" class="text-xs text-indigo-600 hover:underline">Forgot password?</a>
                </div>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg">Login</button>
        </form>

        <button type="button" id="googleSignInBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg mt-3">Sign in with Google</button>

        <hr class="my-4">
        <p class="text-center text-sm text-gray-500">Don't have an account? <a href="signup.html" class="text-indigo-600">Sign up</a></p>
    </div>

    <script>
        // Wait for Firebase to be ready
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const googleBtn = document.getElementById('googleSignInBtn');
            const forgotLink = document.getElementById('forgotPassword');

            // Email/Password Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                if (!email || !password) {
                    alert("Please enter both email and password.");
                    return;
                }
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    window.location.href = "dashboard.html";
                } catch (error) {
                    alert("Login failed: " + error.message);
                }
            });

            // Google Sign-In (with popup – ensure only one click)
            googleBtn.addEventListener('click', async () => {
                // Disable button temporarily to prevent multiple clicks
                googleBtn.disabled = true;
                try {
                    const result = await auth.signInWithPopup(googleProvider);
                    // After successful login, redirect
                    window.location.href = "dashboard.html";
                } catch (error) {
                    if (error.code !== 'auth/cancelled-popup-request') {
                        alert("Google sign-in failed: " + error.message);
                    }
                    googleBtn.disabled = false;
                }
            });

            // Forgot Password
            forgotLink.addEventListener('click', async (e) => {
                e.preventDefault();
                const email = prompt("Enter your email address to reset password:");
                if (email && email.includes('@')) {
                    try {
                        await auth.sendPasswordResetEmail(email);
                        alert("Password reset email sent! Check your inbox.");
                    } catch (error) {
                        alert("Error: " + error.message);
                    }
                } else if (email) {
                    alert("Please enter a valid email address.");
                }
            });
        });
    </script>
</body>
</html>
