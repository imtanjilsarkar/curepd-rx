<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CurePd Rx - Doctor Login</title>
    <!-- Tailwind CSS (free CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .prescription-card {
            transition: transform 0.2s;
        }
        .prescription-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <i class="fas fa-prescription-bottle text-5xl text-indigo-600 mb-3"></i>
            <h1 class="text-3xl font-bold text-gray-800">CurePd Rx</h1>
            <p class="text-gray-500 mt-2">Digital Prescription for Modern Doctors</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 font-medium mb-1">Doctor Email</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="email" id="email" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="doctor@clinic.com" required>
                </div>
            </div>
            <div>
                <label class="block text-gray-700 font-medium mb-1">Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="password" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="••••••" required>
                </div>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">
            Demo credentials: <strong class="font-mono">doctor@curepd.com</strong> / <strong class="font-mono">123456</strong>
        </p>
        <p class="text-center text-xs text-gray-400 mt-2">
            * For demo only – no real authentication yet
        </p>
    </div>

    <script>
        // Simple mock login (no backend)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pwd = document.getElementById('password').value;
            // Hardcoded demo check
            if (email === "doctor@curepd.com" && pwd === "123456") {
                window.location.href = "dashboard.html";
            } else {
                alert("Invalid credentials. Use doctor@curepd.com / 123456");
            }
        });
    </script>
</body>
</html>
