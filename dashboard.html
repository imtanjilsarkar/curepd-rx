<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurePd Rx - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm border-b px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fas fa-prescription-bottle text-2xl text-indigo-600"></i>
            <span class="font-bold text-xl">CurePd Rx</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="doctorName" class="text-gray-600"><i class="fas fa-user-md"></i> Loading...</span>
            <button id="logoutBtn" class="text-red-500 hover:text-red-700">Logout</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">My Prescriptions</h1>
            <a href="new-prescription.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">+ New Prescription</a>
        </div>

        <div class="mb-4">
            <input type="text" id="searchInput" placeholder="Search by patient name or phone..." class="w-full p-2 border rounded">
        </div>

        <div class="bg-white rounded shadow overflow-hidden">
            <table class="min-w-full">
                <thead class="bg-gray-100">
                    <tr><th class="p-3 text-left">Date</th><th class="p-3 text-left">Patient</th><th class="p-3 text-left">Phone</th><th class="p-3 text-left">Action</th></tr>
                </thead>
                <tbody id="prescriptionsTable"></tbody>
            </table>
        </div>
        <div id="emptyState" class="text-center py-8 text-gray-500 hidden">No prescriptions yet. Create your first one.</div>
    </main>

    <script>
        let allPrescriptions = [];

        async function loadPrescriptions() {
            const user = auth.currentUser;
            if (!user) return (window.location.href = "index.html");
            const snapshot = await db.collection("prescriptions").where("doctorId", "==", user.uid).orderBy("date", "desc").get();
            allPrescriptions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderTable();
        }

        function renderTable() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPrescriptions.filter(p => p.patientName.toLowerCase().includes(term) || (p.patientPhone && p.patientPhone.includes(term)));
            const tbody = document.getElementById('prescriptionsTable');
            const empty = document.getElementById('emptyState');
            if (filtered.length === 0) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');
            tbody.innerHTML = filtered.map(p => `
                <tr class="border-t">
                    <td class="p-3">${p.date}</td>
                    <td class="p-3 font-medium">${escapeHtml(p.patientName)}</td>
                    <td class="p-3">${escapeHtml(p.patientPhone || '—')}</td>
                    <td class="p-3"><button class="text-indigo-600 view-btn" data-id="${p.id}">View</button></td>
                </tr>
            `).join('');
            document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', () => window.location.href = `view.html?id=${btn.dataset.id}`));
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }

        auth.onAuthStateChanged(async user => {
            if (!user) window.location.href = "index.html";
            else {
                const doc = await db.collection("doctors").doc(user.uid).get();
                const name = doc.exists ? doc.data().name : user.email;
                document.getElementById('doctorName').innerHTML = `<i class="fas fa-user-md"></i> ${escapeHtml(name)}`;
                loadPrescriptions();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => { await auth.signOut(); window.location.href = "index.html"; });
        document.getElementById('searchInput').addEventListener('input', renderTable);
    </script>
</body>
</html>
