<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurePd Rx - New Prescription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <!-- html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .prescription-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #prescriptionPrintArea, #prescriptionPrintArea * {
                visibility: visible;
            }
            #prescriptionPrintArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 20px;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="max-w-4xl mx-auto py-6 px-4">
        <!-- Header with back button -->
        <div class="flex items-center justify-between mb-6 no-print">
            <a href="dashboard.html" class="text-indigo-600 hover:text-indigo-800"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            <div class="flex gap-2">
                <button id="savePrescriptionBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg"><i class="fas fa-save"></i> Save (Demo)</button>
                <button id="generatePdfBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg"><i class="fas fa-download"></i> Download PDF</button>
            </div>
        </div>

        <!-- Prescription Form + Preview combined -->
        <div class="prescription-card" id="prescriptionPrintArea">
            <div class="border-b border-gray-200 pb-4 mb-4 flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold text-indigo-700">CurePd Rx</h1>
                    <p class="text-sm text-gray-500">Digital Prescription System</p>
                </div>
                <div class="text-right">
                    <p class="text-sm font-semibold">Dr. Demo User</p>
                    <p class="text-xs text-gray-500">BMDC Reg: DEMO123</p>
                    <p class="text-xs text-gray-500">Dhaka Medical Clinic</p>
                </div>
            </div>

            <!-- Patient Info -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Patient Name</label>
                    <input type="text" id="patientName" class="mt-1 w-full border-b border-gray-300 focus:border-indigo-500 outline-none py-1" placeholder="e.g., Rina Begum">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Age</label>
                    <input type="text" id="patientAge" class="mt-1 w-full border-b border-gray-300 focus:border-indigo-500 outline-none py-1" placeholder="45 years">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Phone (optional)</label>
                    <input type="text" id="patientPhone" class="mt-1 w-full border-b border-gray-300 focus:border-indigo-500 outline-none py-1" placeholder="017xxxxxxxx">
                </div>
            </div>

            <!-- Medicines Table (dynamic) -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-gray-600 uppercase">Medicines</label>
                    <button type="button" id="addMedicineBtn" class="text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded"><i class="fas fa-plus"></i> Add Medicine</button>
                </div>
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-200">
                            <th class="text-left py-2">Medicine Name</th>
                            <th class="text-left py-2">Dosage</th>
                            <th class="text-left py-2">Duration</th>
                            <th class="w-8"></th>
                        </tr>
                    </thead>
                    <tbody id="medicinesTableBody">
                        <tr class="medicine-row">
                            <td><input type="text" class="w-full border-b border-gray-200 focus:border-indigo-500 outline-none py-1 medicine-name" placeholder="e.g., Napa 500mg"></td>
                            <td><input type="text" class="w-full border-b border-gray-200 focus:border-indigo-500 outline-none py-1 medicine-dose" placeholder="1+1+1"></td>
                            <td><input type="text" class="w-full border-b border-gray-200 focus:border-indigo-500 outline-none py-1 medicine-duration" placeholder="5 days"></td>
                            <td><button class="text-red-400 remove-medicine"><i class="fas fa-trash-alt"></i></button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Advice -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-gray-600 uppercase">Advice / Instructions</label>
                <textarea id="advice" rows="2" class="mt-1 w-full border border-gray-200 rounded p-2 focus:border-indigo-500 outline-none" placeholder="Take medicines after meal, rest, etc."></textarea>
            </div>

            <!-- Footer / Signature -->
            <div class="border-t border-gray-200 pt-4 text-right text-sm text-gray-500">
                <p>Digitally generated prescription • Valid without signature</p>
                <p class="text-xs">Date: <span id="currentDate"></span></p>
            </div>
        </div>
    </div>

    <script type="module">
    import { auth, db } from './js/firebase-init.js';
    import { collection, addDoc } from "firebase/firestore";
    import { onAuthStateChanged } from "firebase/auth";

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            alert("You must be logged in.");
            window.location.href = "index.html";
            return;
        }

        document.getElementById('savePrescriptionBtn').addEventListener('click', async () => {
            const patientName = document.getElementById('patientName').value.trim();
            if (!patientName) {
                alert("Enter patient name");
                return;
            }
            const medicines = [];
            document.querySelectorAll('.medicine-row').forEach(row => {
                const name = row.querySelector('.medicine-name').value;
                const dose = row.querySelector('.medicine-dose').value;
                const duration = row.querySelector('.medicine-duration').value;
                if (name) medicines.push({ name, dose, duration });
            });
            const prescription = {
                doctorId: user.uid,
                patientName,
                patientAge: document.getElementById('patientAge').value,
                patientPhone: document.getElementById('patientPhone').value,
                advice: document.getElementById('advice').value,
                medicines,
                date: new Date().toISOString().split('T')[0],
                createdAt: new Date()
            };
            try {
                await addDoc(collection(db, "prescriptions"), prescription);
                alert("Prescription saved to cloud!");
                window.location.href = "dashboard.html";
            } catch (error) {
                alert("Error: " + error.message);
            }
        });
    });
</script>
</body>
</html>
