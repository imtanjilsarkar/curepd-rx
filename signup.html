<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurePd Rx - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <h2 class="text-2xl font-bold text-center mb-6">Doctor Sign Up</h2>
        <form id="signupForm">
            <input type="text" id="name" placeholder="Full Name" class="w-full mb-3 p-2 border rounded" required>
            <input type="email" id="email" placeholder="Email" class="w-full mb-3 p-2 border rounded" required>
            <input type="password" id="password" placeholder="Password" class="w-full mb-3 p-2 border rounded" required>
            <input type="text" id="clinic" placeholder="Clinic Name (optional)" class="w-full mb-3 p-2 border rounded">
            <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded">Sign Up</button>
        </form>
        <p class="text-center mt-4">Already have an account? <a href="index.html">Login</a></p>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const clinic = document.getElementById('clinic').value;
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                await db.collection('doctors').doc(user.uid).set({
                    name: name,
                    email: email,
                    clinic: clinic,
                    createdAt: new Date()
                });
                alert("Account created! Please login.");
                window.location.href = "index.html";
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    alert("This email is already registered. Please login instead.");
                } else {
                    alert("Signup failed: " + error.message);
                }
            }
        });
    </script>
</body>
</html>
